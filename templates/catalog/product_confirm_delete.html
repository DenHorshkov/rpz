{% extends "base.html" %}

{% block title %}Видалення · {{ product.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Видалити товар «{{ product.title }}»?</h3>
        <p class="text-muted">Дію не можна скасувати.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Так, видалити</button>
            <a href="{% url 'catalog:my_products' %}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
